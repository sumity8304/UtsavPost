name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Keystore for Release Signing
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "No custom keystore secret detected. Creating automated CI signing key..."
            keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias utsavpost -storepass utsavpost123 -keypass utsavpost123 \
              -dname "CN=UtsavPost, OU=Mobile, O=UtsavPost, L=Delhi, S=Delhi, C=IN"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release-key.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=utsavpost123" >> $GITHUB_ENV
            echo "KEY_ALIAS=utsavpost" >> $GITHUB_ENV
            echo "KEY_PASSWORD=utsavpost123" >> $GITHUB_ENV
          else
            echo "Custom repository keystore secret found. Decoding..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release-key.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Android App Bundle (AAB for Play Store)
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtsavPost-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtsavPost-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtsavPost-Release-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

