plugins {
    id 'com.android.application'
}

// Optional Keystore Properties for Release Signing
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.utsavpost.maker'
    compileSdk 34

    defaultConfig {
        applicationId "com.utsavpost.maker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("KEYSTORE_FILE") ?: keystoreProperties.getProperty('storeFile')
            def storePasswordVal = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty('storePassword')
            def keyAliasVal = System.getenv("KEY_ALIAS") ?: keystoreProperties.getProperty('keyAlias')
            def keyPasswordVal = System.getenv("KEY_PASSWORD") ?: keystoreProperties.getProperty('keyPassword')

            if (storeFilePath && file(storeFilePath).exists()) {
                storeFile file(storeFilePath)
                storePassword storePasswordVal
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // If release signing config has a valid storeFile, use it; otherwise fallback to debug signing
            def releaseStoreFilePath = System.getenv("KEYSTORE_FILE") ?: keystoreProperties.getProperty('storeFile')
            if (releaseStoreFilePath && file(releaseStoreFilePath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    // UI & Material Components
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Image Loading - Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // JSON Serialization - Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Google Mobile Ads SDK
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // Architecture & Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
